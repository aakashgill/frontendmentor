<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Tip calculator app</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title">SPLI<br>TTER</h1>
    
    <div class="calculator-card">
      <div class="input-section">
        <div class="input-group">
          <label for="bill">Bill</label>
          <div class="input-wrapper">
            <img src="./images/icon-dollar.svg" alt="dollar icon" class="input-icon">
            <input type="number" id="bill" placeholder="0" min="0" step="0.1">
          </div>
        </div>

        <div class="input-group">
          <label>Select Tip %</label>
          <div class="tip-buttons">
            <button type="button" class="tip-btn" data-tip="5">5%</button>
            <button type="button" class="tip-btn" data-tip="10">10%</button>
            <button type="button" class="tip-btn" data-tip="15">15%</button>
            <button type="button" class="tip-btn" data-tip="25">25%</button>
            <button type="button" class="tip-btn" data-tip="50">50%</button>
            <div class="custom-btn-wrapper">
              <button type="button" class="tip-btn custom js-custom-btn">Custom</button>
              <div class="input-wrapper custom-input">
                <input type="number" id="custom-input-tip" min="0" placeholder="0" step="0.1">
              </div>
            </div>
          </div>
        </div>

        <div class="input-group">
          <div class="people-label-container">
            <label for="people">Number of People</label>
            <span class="validation-zero">Can't be zero</span>
          </div>
          <div class="input-wrapper">
            <img src="./images/icon-person.svg" alt="person icon" class="input-icon">
            <input type="number" id="people" placeholder="0" min="1" step="1">
          </div>
          
        </div>
      </div>

      <div class="output-section">
        <div class="result-item">
          <div class="result-label">
            <span>Tip Amount</span>
            <span class="result-subtitle">/ person</span>
          </div>
          <div id="tip-pp" class="result-value">$0.00</div>
        </div>

        <div class="result-item">
          <div class="result-label">
            <span>Total</span>
            <span class="result-subtitle">/ person</span>
          </div>
          <div id="total-pp" class="result-value">$0.00</div>
        </div>

        <button id="reset-btn" class="reset-btn">Reset</butto>
      </div>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a target="_blank" href="https://aakashgill.in/?utm_source=frontendmentor">Aakash</a>.
  </div>
  <script src="./script.js"></script>
</body>
</html>
