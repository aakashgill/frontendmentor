<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontendmentor Challangers</title>
  <style>
    body {
      padding: 20px;
      background-color: hsl(212, 45%, 89%);
      color: hsl(218, 44%, 22%)
    }
    .container {
      max-width: 1280px;
      padding: 0 20px;
      margin: auto;
    }
    .cards-container {
      display: flex;
      flex-wrap: wrap;
    }
    .card {
      text-decoration: none;
      background-color: #fff;
      width: 300px;
      border-radius: 10px;
      padding: 20px;
      color: inherit;
      transition: transform .3s;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      &:hover {
        transform: scale(1.1);
        text-decoration: underline;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cards-container">
      <a class="card" href="/qr-code-component-main/">QR-Code Component</a>
    </div>
  </div>
</body>
</html>
