<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>
  <style>
  :root {
    --color-white: hsl(0, 0%, 100%);
    --color-black: hsl(0, 0%, 7%);
    --color-grey: rgb(107, 107, 107);
    --color-yellow: hsl(47, 88%, 63%);
    /* --shadow-1: 0 3px 5px 0 hsla(0, 0%, 0%, 0.102); */
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Figtree", sans-serif;
  }
  body {
    background-color: var(--color-yellow);
  }
  img {
    max-width: 100%;
    height: auto;
  }
  .container {
    max-width: 1280px;
    padding: 0 20px;
    margin: 0 auto;
  }
  .card-container {
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .card {
    max-width: 380px;
    padding: 24px;
    background-color: var(--color-white);
    color: var(--color-black);
    border-radius: 20px;
    border: 1px solid var(--color-black);
    filter: drop-shadow(8px 8px 0 var(--color-black));
  }
  .card-content {
    display: flex;
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }
  .card-image {
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .card-category {
    display: inline-block;
    background-color: var(--color-yellow);
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 800;
    border-radius: 4px;
  }
  .card-date {
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .card-heading {
    font-size: 24px;
    line-height: 1.5;
    font-weight: 800;
  }
  .card-description {
    font-size: 16px;
    color: var(--color-grey);
  }
  .card-author {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-author-img {
    width: 32px;
    height: 32px;
    object-fit: contain;
  }
  .card-author-name {
    font-size: 14px;
    font-weight: 800;
  }
  .attribution {
    padding: 20px;
  }
  </style>
</head>
<body>
  <main class="container">
    <div class="card-container">
      <div class="card">
        <img class="card-image" width="330" height="197" src="./assets/images/illustration-article.svg" alt="article-illustration">
        <div class="card-content">
          <span class="card-category">Learning</span>
          <div class="card-date">
            Published 
            <time datetime="2023-12-21">21 Dec 2023</time>
          </div>
          <h2 class="card-heading">HTML & CSS foundations</h2>
          <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="card-author">
          <img width="32" height="32" class="card-author-img" src="./assets/images/image-avatar.webp" alt="Greg Hooper Image">
          <span class="card-author-name">Greg Hooper</span>
        </div>
      </div>
    </div>
  </main>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a target="_blank" href="https://aakashgill.in">Aakash</a>.
  </div>
</body>
</html>
